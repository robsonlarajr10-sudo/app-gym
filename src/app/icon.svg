<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="128" fill="url(#gradient)"/>
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  
  <!-- Dumbbell Icon -->
  <g transform="translate(128, 180)">
    <!-- Left weight -->
    <rect x="0" y="20" width="40" height="112" rx="8" fill="white"/>
    <rect x="10" y="30" width="20" height="92" rx="4" fill="#F97316" opacity="0.3"/>
    
    <!-- Bar -->
    <rect x="40" y="60" width="176" height="32" rx="16" fill="white"/>
    <circle cx="128" cy="76" r="12" fill="#EC4899"/>
    
    <!-- Right weight -->
    <rect x="216" y="20" width="40" height="112" rx="8" fill="white"/>
    <rect x="226" y="30" width="20" height="92" rx="4" fill="#EC4899" opacity="0.3"/>
  </g>
  
  <!-- Flame accent -->
  <path d="M 256 120 Q 240 100 240 80 Q 240 60 256 50 Q 272 60 272 80 Q 272 100 256 120 Z" fill="white" opacity="0.9"/>
  <path d="M 256 110 Q 246 95 246 82 Q 246 69 256 62 Q 266 69 266 82 Q 266 95 256 110 Z" fill="#FCD34D"/>
</svg>
